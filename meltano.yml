version: 1
send_anonymous_usage_stats: true
project_id: tap-snowflake
default_environment: dev
plugins:
  extractors:
  - name: tap-snowflake
    namespace: tap_snowflake
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - batch
    - structured-logging
    settings:
    - name: user
    - name: password
      kind: password
      sensitive: true
    - name: private_key
      kind: password
      sensitive: true
    - name: private_key_path
    - name: private_key_passphrase
      kind: password
      sensitive: true
    - name: workload_identity_provider
      kind: options
      options:
      - label: AWS
        value: AWS
      - label: Azure
        value: AZURE
      - label: Google Cloud
        value: GCP
    - name: account
      kind: password
    - name: role
    - name: warehouse
    - name: database
    - name: schema
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
environments:
- name: dev
